input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}

    jdbc {
        id => "jdbc-surveyor-activity"
        type => "jdbc-surveyor-activity"
        jdbc_driver_library => "/usr/share/logstash/mysql/mysql-connector-j-9.0.0.jar"
        jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
        jdbc_connection_string => "jdbc:mysql://plithus3.cluster-ro-cyohraivie6h.ap-northeast-2.rds.amazonaws.com:3306/plithus"
        jdbc_user => "${DB_USER}"
        jdbc_password => "${DB_PASSWORD}"
        jdbc_paging_enabled => true
        jdbc_page_size => 100000
        jdbc_default_timezone => "Asia/Seoul"
        tracking_column => "unix_ts_in_secs"
        use_column_value => true
        tracking_column_type => "numeric"
        schedule => "* * * * *"
        statement => "SELECT sa.id as id, sa.response, UNIX_TIMESTAMP(sa.updated_at) AS unix_ts_in_secs,
                        t.id as tester_id, t.phase_1, t.phase_2, t.phase_cheering, t.phase_review,
                        a.id as account_id, a.nickname,
                        g.id as game_id, g.title, g.company, g.started_at, g.expired_at, g.allowed_tot_testers,
                        q.id as question_id, q.content as question_content,
                        c.id as choice_id, c.content as choice_content
                      FROM surveyor_activity sa
                        JOIN account a ON sa.account_id = a.id
                        JOIN game g ON sa.game_id = g.id
                        JOIN tester t ON a.id = t.account_id AND g.id = t.game_id
                        JOIN question q ON sa.question_id = q.id
                        LEFT JOIN choice c ON sa.choice_id = c.id
                      WHERE (UNIX_TIMESTAMP(sa.updated_at) > :sql_last_value AND sa.updated_at < NOW())
                      ORDER BY sa.updated_at ASC"
        last_run_metadata_path => "/usr/share/logstash/metadata/surveyor-activity_last_run_metadata"
    }
}

## Add your filters / logstash plugins configuration here
filter {
    # jdbc input
    if [type] =~ /^jdbc-/ {     # "jdbc-*" 정규표현식
        mutate {
            rename => { "created_at" => "@timestamp" }
            # output 단계에서 사용하지만 ElasticSearch에 보내진 않을 필드를 @metadata로 이동
            copy => { "id" => "[@metadata][_id]" }
            copy => { "type" => "[@metadata][type]" }
            remove_field => ["id", "@version", "unix_ts_in_secs", "type"]
        }
    }
}

output {
    stdout {
        codec => rubydebug {
            metadata => true
        }
    }

