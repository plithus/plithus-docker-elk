input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}

    jdbc {
        id => "jdbc-test-report"
        type => "jdbc-test-report"
        jdbc_driver_library => "/usr/share/logstash/mysql/mysql-connector-j-9.0.0.jar"
        jdbc_driver_class => "com.mysql.jdbc.Driver"
        jdbc_connection_string => "jdbc:mysql://plithus3.cluster-ro-cyohraivie6h.ap-northeast-2.rds.amazonaws.com:3306/plithus"
        jdbc_user => "${DB_USER}"
        jdbc_password => "${DB_PASSWORD}"
        jdbc_paging_enabled => true
        jdbc_page_size => 1000
        jdbc_default_timezone => "Asia/Seoul"
        tracking_column => "unix_ts_in_secs"
        use_column_value => true
        tracking_column_type => "numeric"
        schedule => "* * * * *"
        statement => "SELECT t.id as tester_id, t.created_at, UNIX_TIMESTAMP(t.updated_at) AS unix_ts_in_secs,
                        t.phase_1, t.phase_2, t.phase_cheering, t.phase_review,
                        a.nickname,
                        g.title, g.company, g.started_at, g.expired_at, g.allowed_tot_testers,
                        sa.id as surveyor_activity_id, sa.response,
                        q.content as question,
                        c.content as choice
                      FROM tester t
                        JOIN account a ON t.account_id = a.id
                        JOIN game g ON t.game_id = g.id
                        LEFT JOIN surveyor_activity sa on a.id = sa.account_id AND g.id = sa.game_id
                        LEFT JOIN question q on sa.question_id = q.id
                        LEFT JOIN choice c on sa.choice_id = c.id
                      WHERE (UNIX_TIMESTAMP(q.updated_at) > :sql_last_value AND q.updated_at < NOW())
                      ORDER BY t.updated_at ASC"
        last_run_metadata_path => "/usr/share/logstash/metadata/test-report_last_run_metadata"
    }
}

## Add your filters / logstash plugins configuration here
filter {
    if [type] == "jdbc-test-report" {
        mutate {
            add_field => { "id" => "%{tester_id}-%{surveyor_activity_id}" }
            remove_field => ["tester_id", "surveyor_activity_id"]
        }
    }

    # jdbc input
    if [type] =~ /^jdbc-/ {     # "jdbc-*" 정규표현식
        mutate {
            rename => { "created_at" => "@timestamp" }
            # output 단계에서 사용하지만 ElasticSearch에 보내진 않을 필드를 @metadata로 이동
            copy => { "id" => "[@metadata][_id]" }
            copy => { "type" => "[@metadata][type]" }
            remove_field => ["id", "@version", "unix_ts_in_secs", "type"]
        }
    }
}

output {
    stdout {
        codec => rubydebug {
            metadata => true
        }
    }

